name: Nightly

# The PR suite runs in debug, where the optimizer never touches the float
# maths. This runs it again in release, trains the small examples end to end,
# and tries the beta compiler, so a regression shows up here before a tag
# does. Cargo.lock is not committed, so every run also picks up the newest
# dependency versions.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release tests (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.toolchain }}

      - run: cargo test --release

      # The MNIST examples need a download and char_lm runs for minutes, so
      # only the self-contained ones are trained here.
      - name: Train the small examples
        run: |
          for ex in simple_mlp finetune gan vae reinforce multi_task; do
            echo "::group::$ex"
            cargo run --release --example "$ex"
            echo "::endgroup::"
          done

      - name: Open an issue if the nightly breaks
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Nightly release tests failing on ${{ matrix.toolchain }}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bug'
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['bug', 'area:build'],
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
